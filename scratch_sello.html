<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { background: #040e24; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.sello { width: 170px; height: 170px; cursor: pointer; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.7)); }
</style>
</head>
<body>
<div class="sello">
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="selloGradiente" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="20%" stop-color="#f3d790" />
      <stop offset="50%" stop-color="#c99c3a" />
      <stop offset="80%" stop-color="#8a6316" />
      <stop offset="100%" stop-color="#4e3505" />
    </radialGradient>
    <linearGradient id="bordeLuz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffce8" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#5a3d07" />
    </linearGradient>
    <filter id="deboss" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-1" dy="-1.5" stdDeviation="0.8" flood-color="#ffffff" flood-opacity="0.7"/>
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.5" flood-color="#2d1d02" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Sello de cera con bordes orgánicos -->
  <path d="M100,5 C116,5 129,10 141,18 C153,12 165,18 174,28 C184,38 188,51 184,64 C194,75 196,89 193,103 C196,117 192,131 184,142 C186,155 180,167 170,175 C160,185 147,189 135,185 C124,194 110,196 96,195 C82,194 69,190 59,181 C47,184 35,179 26,170 C16,160 12,148 16,135 C7,124 5,110 8,96 C5,82 8,68 17,57 C14,45 19,33 29,24 C39,15 52,12 64,16 C76,7 89,5 100,5 Z" 
        fill="url(#selloGradiente)" 
        stroke="url(#bordeLuz)" 
        stroke-width="2.5" />

  <!-- Borde interior bajo relieve -->
  <circle cx="100" cy="100" r="73" fill="none" stroke="#543a08" stroke-width="2" opacity="0.65" />
  <circle cx="100" cy="100" r="71.5" fill="none" stroke="#fff4cc" stroke-width="1.2" opacity="0.8" />
  <circle cx="100" cy="100" r="69" fill="url(#selloGradiente)" />

  <!-- Anillo perlado decorativo -->
  <circle cx="100" cy="100" r="63.5" fill="none" stroke="#fff7d9" stroke-width="1.6" stroke-dasharray="2 4" opacity="0.75" />

  <!-- Corona imperial superior -->
  <g transform="translate(100, 52) scale(0.65)" filter="url(#deboss)">
    <path d="M-18,12 L-22,-4 L-9,4 L0,-12 L9,4 L22,-4 L18,12 Z" fill="#3a2403"/>
    <circle cx="-22" cy="-5" r="2.2" fill="#fff" opacity="0.95"/>
    <circle cx="0" cy="-13" r="2.8" fill="#fff" opacity="0.95"/>
    <circle cx="22" cy="-5" r="2.2" fill="#fff" opacity="0.95"/>
  </g>

  <!-- Monograma A L grabado -->
  <g filter="url(#deboss)">
    <text x="81" y="125" 
          font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" 
          font-size="62" 
          font-weight="700" 
          font-style="italic" 
          fill="#3b2302" 
          text-anchor="middle">A</text>
    <text x="117" y="131" 
          font-family="'Great Vibes', cursive" 
          font-size="70" 
          font-weight="600" 
          fill="#331e01" 
          text-anchor="middle">L</text>
  </g>

  <!-- Subtítulo XV AÑOS -->
  <text x="100" y="156" 
        font-family="'Cinzel', serif" 
        font-size="10.5" 
        letter-spacing="3" 
        font-weight="700" 
        fill="#3d2603" 
        text-anchor="middle"
        filter="url(#deboss)">XV AÑOS</text>
</svg>
</div>
</body>
</html>
